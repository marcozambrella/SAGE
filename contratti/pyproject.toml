[project]
name = "contratti"
version = "0.1.0"
description = "Formato degli eventi, configurazione e report condivisi da backend, programma di casa e web app"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contratti"]
