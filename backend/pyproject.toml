[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
# Solo librerie leggere: il server gratuito installa contratti + backend, niente PyTorch (D25).
dependencies = [
    "contratti",
    "fastapi>=0.165.0",
    # client HTTP: script dello storico simulato e client di test di FastAPI (Starlette vuole httpx2)
    "httpx2>=2.16.2",
    # legge i segreti da backend/.env in sviluppo
    "python-dotenv>=1.2.4",
    # fusi orari anche sui server senza il database dei fusi del sistema (zoneinfo)
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
contratti = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
