[project]
name = "casa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "contratti",
    "numpy",
    "opencv-python",  # lo richiede già ultralytics: la versione headless installerebbe un secondo cv2
    "ultralytics>=8.4",
    "torch",
    "torchvision",
    "lap",  # richiesto dal tracker di Ultralytics
    "python-dotenv",  # token e indirizzo del backend dal file .env (mai nel repo)
    "open_clip_torch",  # embedding CLIP congelati per riconoscere le scatole dei farmaci dalle foto (come ARGO)
]

# Sul PC di Marco torch per CPU (nessuna GPU), dall'indice di PyTorch come in ARGO.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
contratti = { workspace = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["casa"]
